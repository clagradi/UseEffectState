name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the same commits as publish.yml, so every PR exercises them.
jobs:
  quality:
    name: Lint, typecheck, build, package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package checks (publint + are-the-types-wrong)
        run: npm run lint:pkg

  test:
    name: Test (Node ${{ matrix.node }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use React 18
        if: matrix.react == 18
        run: npm install --no-save --no-audit --no-fund react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3.0 @types/react-dom@^18.3.0

      - name: Typecheck (against the installed React types)
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

  consumer-smoke:
    name: Consumer smoke test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consumer smoke test
        env:
          SMOKE_REACT_VERSION: ${{ matrix.react }}
        run: npm run smoke:consumer -- ${{ matrix.react == 18 && '--skip-example' || '' }}

      - name: Upload the packed tarball
        if: matrix.react == 19
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: .tmp/consumer-smoke/*.tgz
          if-no-files-found: error
          retention-days: 7

  release-dry-run:
    name: Release dry run (publish the packed tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: consumer-smoke
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the packed tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release

      - name: npm publish --dry-run
        run: |
          shopt -s nullglob
          tarballs=(./release/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          npm publish --dry-run "${tarballs[0]}"
